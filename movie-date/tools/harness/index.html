<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#0b0908}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300&display=swap" rel="stylesheet">
</head><body><canvas id="c"></canvas>
<script type="module">
import { createTheater } from '../../site/js/theater.js';
const q = new URLSearchParams(location.search);
await document.fonts.load('300 72px Newsreader');
const th = await createTheater(document.getElementById('c'), { base: '../../site/', fontFamily: 'Newsreader' });
window.renderAt = (p, opts = {}) => {
  Object.assign(th.state, { fade: 1, light: 1, screen: 1, text: 1, dots: 3, flicker: 1, drift: 0, time: 0, progress: p }, opts);
  th.frame();
  return true;
};
window.ready = true;
</script></body></html>
